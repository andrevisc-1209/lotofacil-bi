<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mega-Sena BI — 3048 sorteios — concursos 1 a 3048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js">


// === SIMULADOR DE JOGO ===
(function(){
  var MIN=6,MAX=15,INICIO=1,TOTAL=60,COLS=10;
  var selecionados=[];

  function brl(v){return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}

  function atualizarContador(){
    var n=selecionados.length;
    var el=document.getElementById('sim-contador');
    if(el) el.textContent=n+'/'+MAX+' selecionados';
    var btn=document.getElementById('sim-btn-simular');
    if(btn) btn.disabled=n<MIN;
  }

  function toggle(num){
    var idx=selecionados.indexOf(num);
    if(idx>=0) selecionados.splice(idx,1);
    else if(selecionados.length<MAX) selecionados.push(num);
    selecionados.sort(function(a,b){return a-b;});
    renderGrid();
    atualizarContador();
  }

  function renderGrid(){
    var g=document.getElementById('sim-grid');
    if(!g) return;
    var h='';
    for(var i=INICIO;i<INICIO+TOTAL;i++){
      var s=selecionados.indexOf(i)>=0;
      var lbl=i<10?'0'+i:''+i;
      h+='<button class="sim-bolinha'+(s?' sim-sel':'')+'" data-n="'+i+'">'+lbl+'</button>';
    }
    g.innerHTML=h;
    g.querySelectorAll('.sim-bolinha').forEach(function(b){
      b.addEventListener('click',function(){toggle(parseInt(this.dataset.n));});
    });
  }

  function limpar(){
    selecionados=[];
    renderGrid();
    atualizarContador();
    var r=document.getElementById('sim-resultado');
    if(r) r.innerHTML='';
  }

  function exibirRes(totalConc,gasto,ganho,premiados,faixas){
    var saldo=ganho-gasto;
    var roi=gasto>0?saldo/gasto*100:0;
    var rcl=roi>0?'roi-pos':roi<-10?'roi-neg':'roi-neu';
    var html='<div class="sim-res-box">';
    html+='<div class="sim-res-grid">';
    html+='<div class="sim-res-item"><span class="sim-res-label">Concursos simulados</span><span class="sim-res-val">'+totalConc+'</span></div>';
    html+='<div class="sim-res-item"><span class="sim-res-label">Gasto total</span><span class="sim-res-val">'+brl(gasto)+'</span></div>';
    html+='<div class="sim-res-item"><span class="sim-res-label">Ganho total</span><span class="sim-res-val">'+brl(ganho)+'</span></div>';
    html+='<div class="sim-res-item"><span class="sim-res-label">Saldo</span><span class="sim-res-val '+rcl+'">'+brl(saldo)+'</span></div>';
    html+='<div class="sim-res-item"><span class="sim-res-label">ROI</span><span class="sim-res-val '+rcl+'">'+roi.toFixed(1)+'%</span></div>';
    html+='<div class="sim-res-item"><span class="sim-res-label">Premiados</span><span class="sim-res-val">'+premiados.length+'</span></div>';
    html+='</div>';
    // tabela de faixas
    var acs=Object.keys(faixas).map(Number).sort(function(a,b){return b-a;});
    if(acs.length){
      html+='<table class="sim-hist-table" style="margin:12px 0"><thead><tr><th>Acertos</th><th>Ocorrências</th><th>%</th></tr></thead><tbody>';
      acs.forEach(function(ac){
        var pct=(faixas[ac]/totalConc*100).toFixed(1);
        html+='<tr><td>'+ac+'</td><td>'+faixas[ac]+'</td><td>'+pct+'%</td></tr>';
      });
      html+='</tbody></table>';
    }
    if(premiados.length>0){
      html+='<details class="sim-hist"><summary>Concursos com prêmio ('+premiados.length+')</summary>';
      html+='<table class="sim-hist-table"><thead><tr><th>Concurso</th><th>Acertos</th><th>Prêmio</th></tr></thead><tbody>';
      premiados.slice(0,200).forEach(function(p){
        html+='<tr><td>#'+p.concurso+'</td><td>'+p.ac+'</td><td>'+(p.ganho?brl(p.ganho):'—')+'</td></tr>';
      });
      html+='</tbody></table></details>';
    }
    html+='</div>';
    var r=document.getElementById('sim-resultado');
    if(r) r.innerHTML=html;
  }

  function simular(){
    if(selecionados.length<MIN) return;
    var raw=(typeof DATA!=='undefined'&&DATA.sorteios_raw)?DATA.sorteios_raw:[];
    var meta=(typeof DATA!=='undefined'&&DATA.sorteios_meta)?DATA.sorteios_meta:[];
    if(!raw.length){
      var r=document.getElementById('sim-resultado');
      if(r) r.innerHTML='<p class="sim-erro">⚠️ Dados não disponíveis. Recarregue a página.</p>';
      return;
    }
    var aposta=selecionados.slice();
    var custo=({6:5,7:35,8:140,9:420,10:1050,11:2310,12:4620,13:8580,14:15015,15:25025}[selecionados.length]||0);
    var gasto=0,ganho=0,premiados=[],faixas={};
    raw.forEach(function(s,i){
      var nums=Array.isArray(s)?s:(s.numeros||s.dezenas||s.bolas||[]);
      if(!nums.length) return;
      gasto+=custo;
      var ac=aposta.filter(function(n){return nums.indexOf(n)>=0;}).length;
      faixas[ac]=(faixas[ac]||0)+1;
      var g=0;
      var m=meta[i]||{};
      if(m.premios&&m.premios[ac]) g=m.premios[ac];
      ganho+=g;
      var concurso=m.concurso||i+1;
      if(g>0) premiados.push({concurso:concurso,ac:ac,ganho:g});
    });
    exibirRes(raw.length,gasto,ganho,premiados,faixas);
  }

  document.addEventListener('DOMContentLoaded',function(){
    var pg=document.getElementById('page-simulador');
    if(!pg) return;
    renderGrid();
    atualizarContador();
    var bs=document.getElementById('sim-btn-simular');
    if(bs) bs.addEventListener('click',simular);
    var bl=document.getElementById('sim-btn-limpar');
    if(bl) bl.addEventListener('click',limpar);
  });
})();
// === FIM SIMULADOR ===


</script>
</body>
</html>
