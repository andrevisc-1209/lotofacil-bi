<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dupla Sena BI — 2999 concursos — 1 a 2999</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js">


// === SIMULADOR DE JOGO — DUPLA SENA ===
(function(){
  var MIN=6,MAX=15,INICIO=1,TOTAL=50,COLS=10;
  var selecionados=[];

  function brl(v){return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}

  function atualizarContador(){
    var n=selecionados.length;
    var el=document.getElementById('sim-contador');
    if(el) el.textContent=n+'/'+MAX+' selecionados';
    var btn=document.getElementById('sim-btn-simular');
    if(btn) btn.disabled=n<MIN;
  }

  function toggle(num){
    var idx=selecionados.indexOf(num);
    if(idx>=0) selecionados.splice(idx,1);
    else if(selecionados.length<MAX) selecionados.push(num);
    selecionados.sort(function(a,b){return a-b;});
    renderGrid();
    atualizarContador();
  }

  function renderGrid(){
    var g=document.getElementById('sim-grid');
    if(!g) return;
    var h='';
    for(var i=INICIO;i<INICIO+TOTAL;i++){
      var s=selecionados.indexOf(i)>=0;
      var lbl=i<10?'0'+i:''+i;
      h+='<button class="sim-bolinha'+(s?' sim-sel':'')+'" data-n="'+i+'">'+lbl+'</button>';
    }
    g.innerHTML=h;
    g.querySelectorAll('.sim-bolinha').forEach(function(b){
      b.addEventListener('click',function(){toggle(parseInt(this.dataset.n));});
    });
  }

  function limpar(){
    selecionados=[];
    renderGrid();
    atualizarContador();
    var r=document.getElementById('sim-resultado');
    if(r) r.innerHTML='';
  }

  function exibirRes(totalConc,gasto,ganho,premiados,faixas1,faixas2,duplos){
    var saldo=ganho-gasto;
    var roi=gasto>0?saldo/gasto*100:0;
    var rcl=roi>0?'roi-pos':roi<-10?'roi-neg':'roi-neu';
    var html='<div class="sim-res-box">';
    html+='<div class="sim-res-grid">';
    html+='<div class="sim-res-item"><span class="sim-res-label">Concursos simulados</span><span class="sim-res-val">'+totalConc+'</span></div>';
    html+='<div class="sim-res-item"><span class="sim-res-label">Gasto total</span><span class="sim-res-val">'+brl(gasto)+'</span></div>';
    html+='<div class="sim-res-item"><span class="sim-res-label">Ganho total</span><span class="sim-res-val">'+brl(ganho)+'</span></div>';
    html+='<div class="sim-res-item"><span class="sim-res-label">Saldo</span><span class="sim-res-val '+rcl+'">'+brl(saldo)+'</span></div>';
    html+='<div class="sim-res-item"><span class="sim-res-label">ROI</span><span class="sim-res-val '+rcl+'">'+roi.toFixed(1)+'%</span></div>';
    html+='<div class="sim-res-item"><span class="sim-res-label">Premiados</span><span class="sim-res-val">'+premiados.length+'</span></div>';
    html+='</div>';
    if(duplos>0) html+='<p class="dupla-bonus">🎯 Ganho nas <b>duas rodadas</b> no mesmo concurso: <b>'+duplos+'x</b></p>';
    // faixas por rodada
    var todasAcs=[].concat(Object.keys(faixas1).map(Number),Object.keys(faixas2).map(Number));
    var acsUniq=[...new Set(todasAcs)].sort(function(a,b){return b-a;});
    if(acsUniq.length){
      html+='<table class="sim-hist-table" style="margin:12px 0"><thead><tr><th>Acertos</th><th>1ª rodada</th><th>2ª rodada</th><th>Total</th></tr></thead><tbody>';
      acsUniq.forEach(function(ac){
        var c1=faixas1[ac]||0,c2=faixas2[ac]||0;
        html+='<tr><td>'+ac+'</td><td>'+c1+'</td><td>'+c2+'</td><td>'+(c1+c2)+'</td></tr>';
      });
      html+='</tbody></table>';
    }
    if(premiados.length>0){
      html+='<details class="sim-hist"><summary>Concursos com prêmio ('+premiados.length+')</summary>';
      html+='<table class="sim-hist-table"><thead><tr><th>Concurso</th><th>1ª rodada</th><th>2ª rodada</th><th>Prêmio</th></tr></thead><tbody>';
      premiados.slice(0,200).forEach(function(p){
        html+='<tr><td>#'+p.concurso+'</td><td>'+p.ac1+'ac</td><td>'+p.ac2+'ac</td><td>'+(p.ganho?brl(p.ganho):'—')+'</td></tr>';
      });
      html+='</tbody></table></details>';
    }
    html+='</div>';
    var r=document.getElementById('sim-resultado');
    if(r) r.innerHTML=html;
  }

  function simular(){
    if(selecionados.length<MIN) return;
    // sorteios_raw é interleaved: índice par=r1, ímpar=r2 do mesmo concurso
    var raw=(typeof DATA!=='undefined'&&DATA.sorteios_raw)?DATA.sorteios_raw:[];
    var meta=(typeof DATA!=='undefined'&&DATA.sorteios_meta)?DATA.sorteios_meta:[];
    if(!raw.length){
      var r=document.getElementById('sim-resultado');
      if(r) r.innerHTML='<p class="sim-erro">⚠️ Dados não disponíveis. Recarregue a página.</p>';
      return;
    }
    var aposta=selecionados.slice();
    var custo=2.50;
    var gasto=0,ganho=0,premiados=[],faixas1={},faixas2={},duplos=0;
    // processar aos pares (r1=i, r2=i+1)
    for(var i=0;i<raw.length;i+=2){
      var r1=Array.isArray(raw[i])?raw[i]:[];
      var r2=i+1<raw.length&&Array.isArray(raw[i+1])?raw[i+1]:[];
      gasto+=custo;
      var ac1=aposta.filter(function(n){return r1.indexOf(n)>=0;}).length;
      var ac2=aposta.filter(function(n){return r2.indexOf(n)>=0;}).length;
      faixas1[ac1]=(faixas1[ac1]||0)+1;
      faixas2[ac2]=(faixas2[ac2]||0)+1;
      var m1=meta[i]||{},m2=meta[i+1]||{};
      var concurso=m1.concurso||(i/2+1);
      var g1=0,g2=0;
      // tenta pegar prêmio do meta; se não tiver, mantém 0
      if(m1.premios&&m1.premios[ac1]) g1=m1.premios[ac1];
      if(m2.premios&&m2.premios[ac2]) g2=m2.premios[ac2];
      var g=g1+g2;
      ganho+=g;
      if(g1>0&&g2>0) duplos++;
      if(g>0) premiados.push({concurso:concurso,ac1:ac1,ac2:ac2,ganho:g});
    }
    var totalConc=Math.floor(raw.length/2);
    exibirRes(totalConc,gasto,ganho,premiados,faixas1,faixas2,duplos);
  }

  document.addEventListener('DOMContentLoaded',function(){
    var pg=document.getElementById('page-simulador');
    if(!pg) return;
    renderGrid();
    atualizarContador();
    var bs=document.getElementById('sim-btn-simular');
    if(bs) bs.addEventListener('click',simular);
    var bl=document.getElementById('sim-btn-limpar');
    if(bl) bl.addEventListener('click',limpar);
  });
})();
// === FIM SIMULADOR ===


</script>
</body>
</html>
