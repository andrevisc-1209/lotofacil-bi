<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Loterias BI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse 1200px 800px at 15% -10%, #211b45 0%, transparent 60%),
                radial-gradient(ellipse 900px 700px at 100% 10%, #0f3d2e 0%, transparent 55%),
                #08090f;
    color: #f1f0f5;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 780px; text-align: center; }
  h1 { font-size: 30px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .sub { color: #6b7280; font-size: 14px; margin-bottom: 40px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .cards { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: #0f1018; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px;
    padding: 36px 24px; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    box-shadow: 0 4px 24px rgba(0,0,0,.3);
  }
  a.card:hover { transform: translateY(-4px); box-shadow: 0 12px 36px rgba(0,0,0,.4); }
  a.card.lotofacil:hover { border-color: rgba(124,58,237,.5); box-shadow: 0 12px 36px rgba(124,58,237,.15); }
  a.card.megasena:hover { border-color: rgba(5,150,105,.5); box-shadow: 0 12px 36px rgba(5,150,105,.15); }
  a.card.lotomania:hover { border-color: rgba(217,119,6,.5); box-shadow: 0 12px 36px rgba(217,119,6,.15); }
  .card-icon { font-size: 44px; margin-bottom: 14px; }
  .card-titulo { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .card-sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
  .card-cta {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700;
    padding: 9px 18px; border-radius: 8px; color: #fff;
  }
  .lotofacil .card-cta { background: #7c3aed; }
  .megasena .card-cta { background: #059669; }
  .lotomania .card-cta { background: #d97706; }
  footer { margin-top: 40px; color: #6b7280; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎰 Loterias BI</h1>
  <div class="sub">Análise estatística dos sorteios — dados oficiais da Caixa</div>
  <div class="cards">
    <a class="card lotofacil" href="lotofacil.html">
      <div class="card-icon">🍀</div>
      <div class="card-titulo">Lotofácil</div>
      <div class="card-sub" id="menu-total-lotofacil">— sorteios</div>
      <span class="card-cta">Abrir →</span>
    </a>
    <a class="card megasena" href="megasena.html">
      <div class="card-icon">💰</div>
      <div class="card-titulo">Mega-Sena</div>
      <div class="card-sub" id="menu-total-megasena">— sorteios</div>
      <span class="card-cta">Abrir →</span>
    </a>
    <a class="card lotomania" href="lotomania.html">
      <div class="card-icon">🎯</div>
      <div class="card-titulo">Lotomania</div>
      <div class="card-sub" id="menu-total-lotomania">— sorteios</div>
      <span class="card-cta">Abrir →</span>
    </a>
  </div>
  <footer>Dados: API oficial Caixa Econômica Federal</footer>
</div>
<script>
const SUPABASE_URL = 'https://rlkxckpybhtmtiznsmod.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsa3hja3B5Ymh0bXRpem5zbW9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MjYyNjMsImV4cCI6MjEwMTEwMjI2M30.H1CL0EQsSPw0DsP6eBImQuL3rdrH_Hy4wgw94shAQA0';
async function contarSorteios(tabela, elId) {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + tabela + '?select=concurso&order=concurso.desc&limit=1', {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, Prefer: 'count=exact' }
    });
    const contentRange = res.headers.get('content-range');
    const total = contentRange ? contentRange.split('/')[1] : null;
    const dados = await res.json();
    const el = document.getElementById(elId);
    if (total && total !== '*') {
      el.textContent = total + ' sorteios';
    } else if (dados && dados.length) {
      el.textContent = 'até o concurso ' + dados[0].concurso;
    } else {
      el.textContent = 'sem dados ainda';
    }
  } catch (e) {
    document.getElementById(elId).textContent = 'indisponível no momento';
  }
}
contarSorteios('sorteios', 'menu-total-lotofacil');
contarSorteios('megasena_sorteios', 'menu-total-megasena');
contarSorteios('lotomania_sorteios', 'menu-total-lotomania');
</script>
</body>
</html>
