name: Atualizar sorteios

on:
  schedule:
    - cron: '0 22 * * 1,3,5'  # Segunda, Quarta e Sexta às 22h UTC (após o sorteio)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Atualizar Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python lotofacil_atualizar.py

      - name: Regerar HTML (lendo do Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python lotofacil_bi.py --source supabase --output lotofacil.html

      - name: Adicionar link "Voltar ao menu"
        # lotofacil_bi.py não sabe da página de menu (index.html) — não mexemos
        # no template Python, só injetamos o link no HTML já gerado.
        run: |
          python3 -c "
          with open('lotofacil.html', encoding='utf-8') as f:
              html = f.read()
          link = '<a href=\"index.html\" style=\"margin-left:auto;color:#a78bfa;text-decoration:none;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;\">← Menu</a>'
          old = '<div id=\"supabase-status\" style=\"display:none;\"></div>'
          if link not in html and old in html:
              html = html.replace(old, link + old, 1)
              with open('lotofacil.html', 'w', encoding='utf-8') as f:
                  f.write(html)
          "

      - name: Publicar no GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lotofacil.html
          git diff --staged --quiet || git commit -m "chore: atualiza Lotofácil $(date '+%d/%m/%Y %H:%M')"
          git push
