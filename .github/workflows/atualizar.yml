name: Atualizar sorteios

on:
  schedule:
    - cron: '0 22 * * 1,3,5'  # Segunda, Quarta e Sexta às 22h UTC (após o sorteio)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Atualizar Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python lotofacil_atualizar.py

      - name: Regerar HTML (lendo do Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python lotofacil_bi.py --source supabase

      - name: Publicar no GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lotofacil_bi.html
          git diff --staged --quiet || git commit -m "chore: atualiza $(date '+%d/%m/%Y %H:%M')"
          git push
